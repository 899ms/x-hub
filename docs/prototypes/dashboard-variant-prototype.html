<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作台优化 · 形态注册表 + 所见即所得布局编辑器（原型）</title>
<style>
  /* ===== 与 x-hub style.css 对齐的令牌（摘取核心，纯演示用） ===== */
  :root {
    --accent: #5b5bf5;
    --brand-500: var(--accent);
    --brand-600: color-mix(in srgb, var(--accent) 78%, #000);
    --brand-50: color-mix(in srgb, var(--accent) 12%, transparent);
    --brand-glow: color-mix(in srgb, var(--accent) 18%, transparent);
    --bg-card-solid: rgba(255, 255, 255, 0.88);
    --bg-card-soft: rgba(255, 255, 255, 0.55);
    --input-bg: rgba(255, 255, 255, 0.86);
    --frost-tint-a: rgba(91, 91, 245, 0.10);
    --frost-tint-b: rgba(236, 72, 153, 0.07);
    --frost-tint-c: rgba(59, 130, 246, 0.09);
    --frost-base-a: rgba(255, 255, 255, 0.76);
    --frost-base-b: rgba(255, 255, 255, 0.66);
    --frost-surface:
      radial-gradient(180% 130% at 0% -12%, var(--frost-tint-a), transparent 55%),
      radial-gradient(150% 120% at 105% 6%, var(--frost-tint-b), transparent 55%),
      radial-gradient(170% 130% at 50% 116%, var(--frost-tint-c), transparent 55%),
      linear-gradient(150deg, var(--frost-base-a) 0%, var(--frost-base-b) 100%);
    --frost-edge: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    --glow-a: rgba(91, 91, 245, 0.18);
    --glow-b: rgba(236, 72, 153, 0.12);
    --glow-c: rgba(59, 130, 246, 0.16);
    --bg-base-a: #edf0fa;
    --bg-base-b: #f6f2ea;
    --bg-page-surface:
      radial-gradient(1200px 800px at 12% -8%, var(--glow-a), transparent 55%),
      radial-gradient(1000px 700px at 100% 4%, var(--glow-b), transparent 55%),
      radial-gradient(1200px 900px at 55% 118%, var(--glow-c), transparent 55%),
      linear-gradient(150deg, var(--bg-base-a) 0%, var(--bg-base-b) 100%);
    --border-soft: rgba(255, 255, 255, 0.55);
    --border-strong: rgba(40, 35, 60, 0.22);
    --text-1: #26231d;
    --text-2: #57524a;
    --text-3: #8d877d;
    --text-4: #6f6a63;
    --text-on-accent: #ffffff;
    --c-yellow-soft: #fde68a;   --c-yellow-ink: #806600;
    --c-red-soft: #fecaca;      --c-red-ink: #b91c1c;
    --c-green-soft: #bbf7d0;    --c-green-ink: #15803d;
    --c-blue-soft: #bae6fd;     --c-blue-ink: #0369a1;
    --radius-sm: 8px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 2px rgba(72, 62, 46, 0.05), 0 8px 24px rgba(72, 62, 46, 0.06);
    --shadow-dock: 0 12px 32px rgba(72, 62, 46, 0.13), 0 28px 64px rgba(72, 62, 46, 0.1);
    --shadow-focus: 0 0 0 3px var(--brand-glow);
    --scrim: rgba(38, 35, 29, 0.48);
  }
  [data-theme="dark"] {
    --accent: #8b8bff;
    --brand-600: color-mix(in srgb, var(--accent) 70%, #fff);
    --brand-50: color-mix(in srgb, var(--accent) 16%, #16161f);
    --brand-glow: color-mix(in srgb, var(--accent) 28%, transparent);
    --bg-card-solid: rgba(255, 255, 255, 0.2);
    --bg-card-soft: rgba(255, 255, 255, 0.1);
    --input-bg: #1d1e29;
    --frost-tint-a: rgba(139, 139, 255, 0.16);
    --frost-tint-b: rgba(236, 72, 153, 0.10);
    --frost-tint-c: rgba(59, 130, 246, 0.13);
    --frost-base-a: rgba(255, 255, 255, 0.14);
    --frost-base-b: rgba(255, 255, 255, 0.08);
    --frost-surface:
      radial-gradient(180% 130% at 0% -12%, var(--frost-tint-a), transparent 55%),
      radial-gradient(150% 120% at 105% 6%, var(--frost-tint-b), transparent 55%),
      radial-gradient(170% 130% at 50% 116%, var(--frost-tint-c), transparent 55%),
      linear-gradient(150deg, var(--frost-base-a) 0%, var(--frost-base-b) 100%);
    --glow-a: rgba(139, 139, 255, 0.20);
    --glow-b: rgba(236, 72, 153, 0.12);
    --glow-c: rgba(59, 130, 246, 0.16);
    --bg-base-a: #191a23;
    --bg-base-b: #23202b;
    --bg-page-surface:
      radial-gradient(1200px 800px at 12% -8%, var(--glow-a), transparent 55%),
      radial-gradient(1000px 700px at 100% 4%, var(--glow-b), transparent 55%),
      radial-gradient(1200px 900px at 55% 118%, var(--glow-c), transparent 55%),
      linear-gradient(150deg, var(--bg-base-a) 0%, var(--bg-base-b) 100%);
    --border-soft: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.22);
    --text-1: #f0eeea;
    --text-2: #c9c5bd;
    --text-3: #9b958b;
    --text-4: #a09a90;
    --text-on-accent: #16161f;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-dock: 0 12px 32px rgba(0, 0, 0, 0.5), 0 28px 64px rgba(0, 0, 0, 0.45);
    --scrim: rgba(10, 10, 16, 0.6);
    --c-yellow-soft: rgba(253, 230, 138, 0.18); --c-yellow-ink: #fde68a;
    --c-red-soft: rgba(254, 202, 202, 0.18);    --c-red-ink: #fca5a5;
    --c-green-soft: rgba(187, 247, 208, 0.18);  --c-green-ink: #86efac;
    --c-blue-soft: rgba(186, 230, 253, 0.18);   --c-blue-ink: #7dd3fc;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg-page-surface);
    color: var(--text-1);
    overflow: hidden;
  }

  /* ===== 整体框架 ===== */
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px;
  }
  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .topbar .tag {
    font-size: 0.7rem;
    color: var(--brand-500);
    background: var(--brand-50);
    border: 1px solid var(--brand-50);
    border-radius: var(--radius-pill);
    padding: 2px 10px;
    white-space: nowrap;
  }
  .topbar .spacer { flex: 1; }

  .concepts {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .concept {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 12px;
    background: var(--frost-surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    font-size: 0.72rem;
    line-height: 1.5;
    color: var(--text-2);
  }
  .concept b { color: var(--text-1); }
  .concept .num {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: var(--radius-pill);
    background: var(--brand-500);
    color: var(--text-on-accent);
    font-size: 0.66rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
  }

  /* ===== 左侧模块库 ===== */
  .library {
    flex-shrink: 0;
    width: 232px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px;
    overflow-y: auto;
    background: var(--frost-surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }
  .lib-title {
    margin: 0 0 2px;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .lib-item {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    background: var(--bg-card-solid);
    padding: 8px 10px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .lib-item:active { cursor: grabbing; }
  .lib-item.dragging { opacity: 0.4; }
  .lib-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-1);
  }
  .lib-head .ic { font-size: 0.95rem; }
  .lib-head .hint {
    flex: 1;
    text-align: right;
    font-size: 0.64rem;
    font-weight: 500;
    color: var(--text-3);
    white-space: nowrap;
  }
  .lib-variants {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .vchip {
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--text-3);
    background: var(--bg-card-soft);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-pill);
    padding: 2px 8px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .vchip:hover { border-color: var(--brand-500); color: var(--brand-500); }
  .vchip.on {
    background: var(--brand-500);
    border-color: var(--brand-500);
    color: var(--text-on-accent);
  }
  .lib-meta {
    margin-top: 5px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .lib-meta .pill {
    font-size: 0.62rem;
    color: var(--text-3);
    background: var(--bg-card-soft);
    border-radius: 4px;
    padding: 1px 6px;
    font-variant-numeric: tabular-nums;
  }
  .lib-item.locked { opacity: 0.85; cursor: default; }
  .lib-item.locked .lib-head { color: var(--text-3); }

  /* ===== 右侧画布 ===== */
  .canvas-wrap {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    background: var(--frost-surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    position: relative;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .canvas-wrap.over {
    border-color: var(--brand-500);
    box-shadow: var(--shadow-focus);
  }
  .canvas-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--text-3);
  }
  .canvas-bar .spacer { flex: 1; }
  .canvas-bar button {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-2);
    background: var(--bg-card-solid);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 3px 10px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .canvas-bar button:hover { border-color: var(--brand-500); color: var(--brand-500); }
  .canvas-bar button.primary {
    background: var(--brand-500);
    border-color: var(--brand-500);
    color: var(--text-on-accent);
  }
  .canvas-bar button.primary:hover { opacity: 0.88; color: var(--text-on-accent); }
  .canvas-bar input[type=range] { width: 90px; accent-color: var(--brand-500); }
  .canvas-bar .zoom-val { font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .canvas-bar .audit { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .canvas-bar .audit input { accent-color: var(--brand-500); }

  .canvas-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 6px;
  }
  .canvas {
    position: relative;
    flex-shrink: 0;
    background:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size: calc(100% / 12) 100%, 100% calc(100% / 15);
    background-color: var(--bg-card-soft);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: repeat(15, minmax(0, 1fr));
    gap: 8px;
    transform-origin: 0 0;
  }

  /* ===== 卡片 ===== */
  .dash-cell {
    position: relative;
    border-radius: 10px;
    background: var(--frost-surface);
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    cursor: grab;
    user-select: none;
    touch-action: none;
    container-type: size;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .dash-cell:hover { border-color: var(--brand-500); box-shadow: var(--shadow-dock); }
  .dash-cell.dragging { opacity: 0.4; }
  .dash-cell.fit-below { border-color: var(--c-red-ink); }
  .dash-cell.fit-mid { border-color: var(--c-yellow-ink); }
  .dash-cell.fit-room { border-color: var(--c-blue-ink); }
  .dash-cell.fit-ideal { border-color: var(--c-green-ink); }

  .cell-ctrl {
    position: absolute;
    top: 3px; right: 3px;
    display: flex;
    gap: 2px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .dash-cell:hover .cell-ctrl { opacity: 1; }
  .cell-btn {
    width: 15px; height: 15px;
    border: none;
    border-radius: 4px;
    background: var(--scrim);
    color: #fff;
    font-size: 0.72rem;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .cell-btn:hover { background: var(--brand-500); }

  .cell-tag {
    position: absolute;
    left: 3px; top: 3px;
    z-index: 5;
    max-width: 60%;
    font-size: 0.55rem;
    font-weight: 600;
    color: var(--text-3);
    background: color-mix(in srgb, var(--bg-page-surface) 70%, transparent);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .cell-badge {
    position: absolute;
    left: 3px; bottom: 3px;
    z-index: 5;
    font-size: 0.56rem;
    font-weight: 700;
    border-radius: 4px;
    padding: 0 5px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .dash-cell:hover .cell-badge,
  .audit-on .dash-cell .cell-badge { opacity: 1; }
  .cell-badge.b-below { background: var(--c-red-soft); color: var(--c-red-ink); }
  .cell-badge.b-mid { background: var(--c-yellow-soft); color: var(--c-yellow-ink); }
  .cell-badge.b-ideal { background: var(--c-green-soft); color: var(--c-green-ink); }
  .cell-badge.b-room { background: var(--c-blue-soft); color: var(--c-blue-ink); }

  .cell-size {
    position: absolute;
    right: 3px; bottom: 3px;
    z-index: 5;
    font-size: 0.55rem;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--text-3);
    background: color-mix(in srgb, var(--bg-page-surface) 70%, transparent);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 0 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .dash-cell:hover .cell-size { opacity: 1; }

  .cell-resize {
    position: absolute;
    right: 0; bottom: 0;
    width: 16px; height: 16px;
    cursor: nwse-resize;
    z-index: 6;
    touch-action: none;
  }
  .cell-resize::after {
    content: '';
    position: absolute;
    right: 3px; bottom: 3px;
    width: 6px; height: 6px;
    border-right: 2px solid var(--brand-500);
    border-bottom: 2px solid var(--brand-500);
    border-bottom-right-radius: 2px;
    opacity: 0.75;
  }

  /* 落位预览虚框 */
  .preview {
    border: 2px dashed var(--brand-500);
    border-radius: 10px;
    background: var(--brand-50);
    opacity: 0.75;
    pointer-events: none;
    z-index: 2;
  }
  .preview.bad { border-color: var(--c-red-ink); background: var(--c-red-soft); opacity: 0.8; }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--text-3);
    pointer-events: none;
  }
  .empty-hint .big { font-size: 1.5rem; }

  /* ===== 卡片内容（真实渲染，容器查询单位自适应格子） ===== */
  .card-inner {
    width: 100%;
    height: 100%;
    padding: 4cqh 3cqw;
    display: flex;
    flex-direction: column;
    gap: 1.2cqh;
    overflow: hidden;
  }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 时钟 · 大时钟 */
  .c-time { font-size: 11cqh; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .c-date { font-size: 2.6cqh; font-weight: 500; color: var(--text-3); }
  .c-wx { font-size: 2.6cqh; font-weight: 600; color: var(--text-2); }
  .c-quote {
    margin-top: auto;
    font-size: 2.4cqh;
    font-weight: 600;
    line-height: 1.4;
    background: linear-gradient(100deg, var(--brand-500), #f472b6 45%, #38bdf8 80%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }

  /* 时钟 · 今日阴阳历 */
  .l-time { font-size: 9cqh; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .l-solar { font-size: 2.7cqh; font-weight: 500; color: var(--text-2); }
  .l-lunar { font-size: 3.2cqh; font-weight: 700; color: var(--brand-500); }
  .l-div { border-top: 1px solid var(--border-soft); margin: 0; }
  .l-extra { font-size: 2.3cqh; color: var(--text-3); line-height: 1.5; }

  /* 时钟 · 整月日历 */
  .m-head { font-size: 3cqh; font-weight: 700; color: var(--text-1); }
  .m-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.6cqh; }
  .m-cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1cqh; color: var(--text-3); font-variant-numeric: tabular-nums;
    border-radius: 3px;
  }
  .m-cell.wd { color: var(--text-4); font-weight: 600; }
  .m-cell.today { background: var(--brand-500); color: var(--text-on-accent); font-weight: 700; }
  .m-cell.other { opacity: 0.35; }

  /* 时钟 · 极简时间 */
  .mini-t {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12cqh; font-weight: 700;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text-1);
  }
  .mini-sec { font-size: 5cqh; font-weight: 600; color: var(--brand-500); }

  /* 天气 · 简版 */
  .w-now { height: 100%; display: flex; align-items: center; gap: 3cqw; }
  .w-now .ic { font-size: 8cqh; }
  .w-now .tp { font-size: 7cqh; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .w-now .ct { font-size: 2.8cqh; color: var(--text-3); margin-left: auto; }

  /* 天气 · 详情版 */
  .wd-head { display: flex; align-items: baseline; gap: 2cqw; }
  .wd-head .tp { font-size: 9cqh; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; }
  .wd-head .desc { font-size: 2.8cqh; color: var(--text-3); }
  .wd-head .ct { margin-left: auto; font-size: 2.6cqh; color: var(--text-3); }
  .wd-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1cqh 3cqw; align-content: center; }
  .wd-item { display: flex; flex-direction: column; gap: 0.2cqh; padding: 1.4cqh 1.6cqw; background: var(--bg-card-soft); border-radius: 6px; }
  .wd-item .k { font-size: 2cqh; color: var(--text-3); }
  .wd-item .v { font-size: 3cqh; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; }
  .wd-foot { display: flex; justify-content: space-between; font-size: 2.2cqh; color: var(--text-3); }

  /* 天气 · 一周预报 */
  .ww-row { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 1cqw; }

<script>
/* ================================================================
 * 形态注册表：每个模块声明自己的形态，每个形态声明 min / ideal / render
 * ================================================================ */
const MODULES = {

/* ================================================================
 * 卡片渲染器：真实内容缩略（容器查询单位 cqw/cqh，随格子弹性伸缩）
 * ================================================================ */
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
function monthGridHTML() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (const wd of WEEK) cells.push(`<div class="m-cell wd">${wd}</div>`);
  for (let i = 0; i < first; i++) cells.push('<div class="m-cell other"></div>');
  for (let d = 1; d <= days; d++) {
    const today = d === now.getDate();
    cells.push(`<div class="m-cell${today ? ' today' : ''}">${d}</div>`);
  }
  return cells.join('');
}

const RENDER = {
  'clock.big': () => `
    <div class="card-inner">

  'clock.month': () => `
    <div class="card-inner">

    </div>`,
  'clock.minimal': () => `
    <div class="card-inner" style="padding:0">

    </div>`,
  'weather.now': () => `
    <div class="card-inner"><div class="w-now">
      <span class="ic">⛅</span>
      <span class="tp">28°</span>
      <span class="ct">上海</span>

  'weather.detail': () => `
    <div class="card-inner">
      <div class="wd-head">
        <span class="tp">28°</span>
        <span class="desc">多云</span>
        <span class="ct">上海</span>
      </div>
      <div class="wd-grid">
        <div class="wd-item"><span class="k">体感温度</span><span class="v">29°</span></div>
        <div class="wd-item"><span class="k">湿度</span><span class="v">62%</span></div>
        <div class="wd-item"><span class="k">东南风</span><span class="v">3 级</span></div>

/* ================================================================
 * 布局状态
 * ================================================================ */
const DASH_COLS = 12, DASH_ROWS = 15, GAP = 8;
const canvasBaseW = 880, canvasBaseH = 620;
let zoom = 1.2;
let uid = 0;
let placements = [];   // { uid, mod, variant, x, y, w, h }
const selectVariant = {}; // mod -> 库区当前选中的形态

const $ = (id) => document.getElementById(id);
const grid = $('grid'), canvas = $('canvas'), ghost = $('ghost'), chip = $('floatChip'), pop = $('pop');

function collides(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function overlaps(rect, ignoreUid) {
  return placements.some((p) => p.uid !== ignoreUid && collides(rect, p));
}
function findFreeSpot(w, h, x, y, list) {
  const others = list || placements;
  const cx = Math.min(Math.max(x, 0), DASH_COLS - w);
  let maxY = 0;
  for (const p of others) maxY = Math.max(maxY, p.y + p.h);
  const limit = Math.max(y, 0) + Math.max(h, maxY);
  for (let yy = Math.max(y, 0); yy <= limit; yy++) {
    const rect = { x: cx, y: yy, w, h };
    if (!others.some((q) => collides(rect, q))) return { x: cx, y: yy };
  }
  return { x: cx, y: Math.max(y, 0) };
}

/* ---- 适配状态计算 ---- */
function fitState(w, h, v) {
  if (!v) return { level: 'mid', label: '' };
  const below = w < v.min.w || h < v.min.h;
  const atIdeal = w >= v.ideal.w && h >= v.ideal.h;
  const exactly = w === v.ideal.w && h === v.ideal.h;
  if (below) return { level: 'below', label: `低于最小 ${v.min.w}×${v.min.h}`, cls: 'b-below', dot: 'dot-red' };
  if (exactly) return { level: 'ideal', label: '正好铺满', cls: 'b-ideal', dot: 'dot-green' };
  if (atIdeal) return { level: 'room', label: `有弹性空间 · 推荐 ${v.ideal.w}×${v.ideal.h}`, cls: 'b-room', dot: 'dot-blue' };
  return { level: 'mid', label: `紧凑可读 · 推荐 ${v.ideal.w}×${v.ideal.h}`, cls: 'b-mid', dot: 'dot-amber' };
}
function fillRatio(w, h, v) {
  if (!v) return 1;
  return Math.min(w / v.ideal.w, h / v.ideal.h);
}

/* ================================================================
 * 渲染
 * ================================================================ */
function renderLibrary() {
  const lib = $('library');
  lib.innerHTML = '<p class="lib-title">模块库 · 先选形态再拖入</p>';
  for (const [modId, mod] of Object.entries(MODULES)) {
    const vKeys = Object.keys(mod.variants);
    if (!selectVariant[modId]) selectVariant[modId] = vKeys[0];
    const sel = selectVariant[modId];
    const v = mod.variants[sel];
    const single = vKeys.length === 1;
    const item = document.createElement('div');
    item.className = 'lib-item' + (single ? ' locked' : '');
    item.dataset.mod = modId;
    item.innerHTML = `
      <div class="lib-head">
        <span class="ic">${mod.icon}</span>
        <span>${mod.name}</span>
        <span class="hint">拖入画布</span>
      </div>
      <div class="lib-variants">
        ${vKeys.map((k) => `<span class="vchip${k === sel ? ' on' : ''}" data-mod="${modId}" data-v="${k}">${mod.variants[k].name}</span>`).join('')}
      </div>
      <div class="lib-meta">
        <span class="pill">拖入 ${v.ideal.w}×${v.ideal.h}</span>
        <span class="pill">最小 ${v.min.w}×${v.min.h}</span>
        <span class="pill">${v.note}</span>
      </div>`;
    lib.appendChild(item);
  }
  // 绑定库区拖拽 + 形态选择
  lib.querySelectorAll('.lib-item').forEach((el) => {
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.vchip')) return;
      if (MODULES[el.dataset.mod] && Object.keys(MODULES[el.dataset.mod].variants).length === 1) {
        // 单形态模块：直接拖
      }
      startLibraryDrag(el.dataset.mod, e);
    });
  });
  lib.querySelectorAll('.vchip').forEach((ch) => {
    ch.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      selectVariant[ch.dataset.mod] = ch.dataset.v;
      renderLibrary();
      if (pop.style.display !== 'none') closePop();
    });
  });
}

function renderCanvas() {
  grid.innerHTML = '';
  const auditOn = $('auditToggle').checked;
  const sorted = [...placements].sort((a, b) => a.uid - b.uid);
  for (const p of sorted) {
    const mod = MODULES[p.mod];
    const v = mod.variants[p.variant];
    const fit = fitState(p.w, p.h, v);
    const el = document.createElement('div');
    el.className = `dash-cell fit-${fit.level}` + (auditOn ? '' : '');
    el.dataset.uid = p.uid;
    el.style.gridColumn = `${p.x + 1} / span ${p.w}`;
    el.style.gridRow = `${p.y + 1} / span ${p.h}`;
    el.innerHTML = `
      <span class="cell-tag">${mod.icon} ${mod.name} · ${v.name}</span>
      <div class="cell-ctrl">
        <button class="cell-btn" data-act="variant" title="切换形态">⇄</button>
        <button class="cell-btn" data-act="remove" title="移除">✕</button>
      </div>
      <div class="cell-badge ${fit.cls}">${fit.label}</div>
      <span class="cell-size">${p.w}×${p.h}</span>
      <span class="cell-resize"></span>
      <div class="card-inner">${RENDER[p.mod + '.' + p.variant]()}</div>`;
    // 移动
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.cell-ctrl') || e.target.closest('.cell-resize')) return;
      startCanvasMove(p, e);
    });
    // 缩放
    el.querySelector('.cell-resize').addEventListener('pointerdown', (e) => startResize(p, e));
    // 操作按钮
    el.querySelector('[data-act=variant]').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      openPop(p, el);
    });
    el.querySelector('[data-act=remove]').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      placements = placements.filter((q) => q.uid !== p.uid);
      render();
    });
    grid.appendChild(el);
  }
  $('emptyHint').style.display = placements.length ? 'none' : 'flex';
  renderStatus();
}

function renderStatus() {
  const counts = { below: 0, mid: 0, ideal: 0, room: 0 };
  for (const p of placements) {
    const fit = fitState(p.w, p.h, MODULES[p.mod].variants[p.variant]);
    counts[fit.level]++;
  }
  $('statusbar').innerHTML = `
    <span class="s-item"><span class="s-dot dot-green"></span>正好铺满 ${counts.ideal}</span>
    <span class="s-item"><span class="s-dot dot-amber"></span>紧凑可读 ${counts.mid}</span>
    <span class="s-item"><span class="s-dot dot-blue"></span>弹性空间 ${counts.room}</span>
    <span class="s-item"><span class="s-dot dot-red"></span>低于最小 ${counts.below}</span>
    <span class="spacer"></span>
    <span>${placements.length} 个模块 · 悬浮卡片查看适配详情 · 点 ⇄ 切换形态</span>`;
}

function render() {
  renderCanvas();
}

/* ================================================================
 * 指针坐标 / 画布几何
 * ================================================================ */
function cellFromPoint(clientX, clientY) {
  const rect = grid.getBoundingClientRect();
  const cellW = (rect.width - (DASH_COLS - 1) * GAP * zoom) / DASH_COLS;
  const cellH = (rect.height - (DASH_ROWS - 1) * GAP * zoom) / DASH_ROWS;
  const col = Math.min(Math.max(Math.floor((clientX - rect.left) / (cellW + GAP * zoom)), 0), DASH_COLS - 1);
  const row = Math.min(Math.max(Math.floor((clientY - rect.top) / (cellH + GAP * zoom)), 0), DASH_ROWS);
  return { col, row };
}
function isInsideCanvas(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
}

/* ================================================================
 * 拖拽状态机（pointer 事件，与真实编辑器同款）
 * ================================================================ */
let drag = null;
let dragListeners = null;

function attachDrag() {
  if (dragListeners) return;
  dragListeners = {
    move: (e) => onDragMove(e),
    up: (e) => onDragUp(e),
    key: (e) => {
      if (e.key === 'Escape' && drag) { cancelDrag(); }
    },
  };
  window.addEventListener('pointermove', dragListeners.move);
  window.addEventListener('pointerup', dragListeners.up);
  window.addEventListener('keydown', dragListeners.key);
}
function detachDrag() {
  if (!dragListeners) return;
  window.removeEventListener('pointermove', dragListeners.move);
  window.removeEventListener('pointerup', dragListeners.up);
  window.removeEventListener('keydown', dragListeners.key);
  dragListeners = null;
}

function startLibraryDrag(modId, e) {
  e.preventDefault();
  const v = MODULES[modId].variants[selectVariant[modId]];
  drag = {
    mode: 'library', mod: modId, variant: selectVariant[modId],
    w: v.ideal.w, h: v.ideal.h,
    startX: e.clientX, startY: e.clientY,
    started: false, moved: false,
  };
  ghost.style.display = 'flex';
  ghost.innerHTML = `${MODULES[modId].icon} ${MODULES[modId].name} <span class="gs">${drag.w}×${drag.h}</span>`;
  moveGhost(e);
  attachDrag();
}

function startCanvasMove(p, e) {
  e.preventDefault();
  drag = {
    mode: 'move', p, uid: p.uid,
    w: p.w, h: p.h,
    startX: e.clientX, startY: e.clientY,
    started: false, moved: false,
  };
  ghost.style.display = 'flex';
  ghost.innerHTML = `${MODULES[p.mod].icon} ${MODULES[p.mod].name} <span class="gs">${p.w}×${p.h}</span>`;
  moveGhost(e);
  attachDrag();
}

function startResize(p, e) {
  e.preventDefault();
  e.stopPropagation();
  drag = {
    mode: 'resize', p, uid: p.uid,
    w: p.w, h: p.h,
    startX: e.clientX, startY: e.clientY,
    started: false, moved: false,
  };
  attachDrag();
}

function moveGhost(e) {
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
}

function onDragMove(e) {
  if (!drag) return;
  const d = drag;
  moveGhost(e);
  if (!d.started) {
    if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 6) return;
    d.started = true;
  }
  d.moved = true;

  if (d.mode === 'resize') {
    const p = d.p;
    const inside = isInsideCanvas(e.clientX, e.clientY);
    if (!inside) return;
    const cell = cellFromPoint(e.clientX, e.clientY);
    const v = MODULES[p.mod].variants[p.variant];
    const nw = Math.min(Math.max(cell.col - p.x + 1, v.min.w), DASH_COLS - p.x);
    const nh = Math.max(cell.row - p.y + 1, v.min.h);
    p.w = nw; p.h = nh;
    showChip(e, p);
    renderCanvas();
    return;
  }

  const inside = isInsideCanvas(e.clientX, e.clientY);
  $('canvasWrap').classList.toggle('over', inside);
  if (!inside) {
    clearPreview();
    hideChip();
    return;
  }
  const cell = cellFromPoint(e.clientX, e.clientY);
  const col = Math.min(Math.max(cell.col, 0), DASH_COLS - d.w);
  const others = d.mode === 'move' ? placements.filter((q) => q.uid !== d.uid) : placements;
  const spot = findFreeSpot(d.w, d.h, col, cell.row, others);
  showPreview(spot.x, spot.y, d.w, d.h, d);
  showChipAt(spot.x, spot.y, d.w, d.h, d);
}

function showPreview(x, y, w, h, d) {
  clearPreview();
  const v = d.mode === 'move'
    ? MODULES[d.p.mod].variants[d.p.variant]
    : MODULES[d.mod].variants[d.variant];
  const fit = fitState(w, h, v);
  const el = document.createElement('div');
  el.className = 'preview' + (fit.level === 'below' ? ' bad' : '');
  el.style.gridColumn = `${x + 1} / span ${w}`;
  el.style.gridRow = `${y + 1} / span ${h}`;
  el.id = 'previewEl';
  grid.appendChild(el);
}
function clearPreview() {
  const el = $('previewEl');
  if (el) el.remove();
}

function showChip(e, p) {
  const v = MODULES[p.mod].variants[p.variant];
  const fit = fitState(p.w, p.h, v);
  const ratio = Math.round(fillRatio(p.w, p.h, v) * 100);
  chip.style.display = 'flex';
  chip.style.left = Math.min(e.clientX + 14, window.innerWidth - 190) + 'px';
  chip.style.top = e.clientY + 18 + 'px';
  chip.style.background = levelBg(fit.level);
  chip.style.color = levelFg(fit.level);
  chip.innerHTML = `<span>${MODULES[p.mod].icon} ${p.w}×${p.h}</span>
    <span class="bar"><i style="width:${ratio}%;background:${levelAccent(fit.level)}"></i></span>
    <span>${fit.label}</span>`;
}
function showChipAt(x, y, w, h, d) {
  const v = d.mode === 'move'
    ? MODULES[d.p.mod].variants[d.p.variant]
    : MODULES[d.mod].variants[d.variant];
  const fit = fitState(w, h, v);
  const rect = canvas.getBoundingClientRect();
  const cx = rect.left + (x + w / 2) / DASH_COLS * rect.width;
  const cy = rect.top + (y + h / 2) / DASH_ROWS * rect.height;
  chip.style.display = 'flex';
  chip.style.left = Math.min(cx + 12, window.innerWidth - 190) + 'px';
  chip.style.top = Math.max(cy - 26, 8) + 'px';
  chip.style.background = levelBg(fit.level);
  chip.style.color = levelFg(fit.level);
  const ratio = Math.round(fillRatio(w, h, v) * 100);
  chip.innerHTML = `<span>${MODULES[d.mod].icon} 落位 ${w}×${h}</span>
    <span class="bar"><i style="width:${ratio}%;background:${levelAccent(fit.level)}"></i></span>
    <span>${fit.label}</span>`;
}
function hideChip() { chip.style.display = 'none'; }
function levelBg(l) { return { below: 'var(--c-red-soft)', mid: 'var(--c-yellow-soft)', ideal: 'var(--c-green-soft)', room: 'var(--c-blue-soft)' }[l]; }
function levelFg(l) { return { below: 'var(--c-red-ink)', mid: 'var(--c-yellow-ink)', ideal: 'var(--c-green-ink)', room: 'var(--c-blue-ink)' }[l]; }
function levelAccent(l) { return { below: 'var(--c-red-ink)', mid: 'var(--c-yellow-ink)', ideal: 'var(--c-green-ink)', room: 'var(--c-blue-ink)' }[l]; }

function onDragUp(e) {
  if (!drag) return;
  const d = drag;
  const wasMoved = d.moved;
  drag = null;
  detachDrag();
  ghost.style.display = 'none';
  hideChip();
  clearPreview();
  $('canvasWrap').classList.remove('over');

  if (!wasMoved) return;

  if (d.mode === 'resize') {
    renderCanvas();
    return;
  }

  if (!isInsideCanvas(e.clientX, e.clientY)) {
    // 拖出画布：视为取消
    renderCanvas();
    return;
  }
  const cell = cellFromPoint(e.clientX, e.clientY);
  const col = Math.min(cell.col, DASH_COLS - d.w);
  if (d.mode === 'library') {
    const v = MODULES[d.mod].variants[d.variant];
    const spot = findFreeSpot(d.w, d.h, col, cell.row);
    placements.push({ uid: ++uid, mod: d.mod, variant: d.variant, x: spot.x, y: spot.y, w: d.w, h: d.h });
    renderCanvas();
  } else {
    const others = placements.filter((q) => q.uid !== d.uid);
    const spot = findFreeSpot(d.w, d.h, col, cell.row, others);
    d.p.x = spot.x; d.p.y = spot.y;
    renderCanvas();
  }
}
function cancelDrag() {
  if (drag && drag.mode === 'resize') {
    const p = drag.p;
    // 无回退快照，直接按当前渲染
  }
  drag = null;
  detachDrag();
  ghost.style.display = 'none';
  hideChip();
  clearPreview();
  $('canvasWrap').classList.remove('over');
  renderCanvas();
}

/* ================================================================
 * 形态切换浮层
 * ================================================================ */
function openPop(p, el) {
  closePop();
  const mod = MODULES[p.mod];
  const vKeys = Object.keys(mod.variants);
  const curV = p.variant;
  const fitCur = fitState(p.w, p.h, mod.variants[curV]);
  pop.innerHTML = `
    <div class="pop-title">${mod.icon} ${mod.name} · 选择展示形态</div>
    ${vKeys.map((k) => {
      const v = mod.variants[k];
      const fit = k === curV ? fitCur : fitState(p.w, p.h, v);
      const ok = p.w >= v.min.w && p.h >= v.min.h;
      return `<div class="pop-opt${k === curV ? ' on' : ''}" data-v="${k}">
        <div class="pop-thumb"><div class="th-in">${RENDER[p.mod + '.' + k]()}</div></div>
        <div class="pop-opt-info">
          <div class="pop-opt-name">${v.name}${k === curV ? '<span class="cur">当前</span>' : ''}</div>
          <div class="pop-opt-desc">${v.note}</div>
          <div class="pop-opt-fit" style="color:${ok ? 'var(--c-green-ink)' : 'var(--c-red-ink)'}">
            ${ok ? '✓' : '⚠'} 当前格 ${p.w}×${p.h} · 最小 ${v.min.w}×${v.min.h} · 推荐 ${v.ideal.w}×${v.ideal.h}
          </div>
        </div>
      </div>`;
    }).join('')}
    <div class="pop-foot">切换形态后，若格子小于新形态的最小尺寸，将自动补到最小尺寸并就近让位。</div>`;
  pop.style.display = 'flex';
  const r = el.getBoundingClientRect();
  let left = r.right + 8;
  let top = r.top;
  if (left + 300 > window.innerWidth - 8) left = r.left - 308;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, window.innerHeight - pop.offsetHeight - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  pop.querySelectorAll('.pop-opt').forEach((opt) => {
    opt.addEventListener('click', () => {
      const nv = opt.dataset.v;
      if (nv === p.variant) { closePop(); return; }
      p.variant = nv;
      const v = mod.variants[nv];
      // 格子小于新形态最小尺寸 → 补到最小，必要时就近让位
      if (p.w < v.min.w || p.h < v.min.h) {
        const nw = Math.max(p.w, Math.min(v.min.w, DASH_COLS - p.x));
        const nh = Math.max(p.h, v.min.h);
        const rect = { ...p, w: nw, h: nh };
        if (overlaps(rect, p.uid)) {
          const others = placements.filter((q) => q.uid !== p.uid);
          const spot = findFreeSpotIn(nw, nh, p.x, p.y, others);
          p.x = spot.x; p.y = spot.y;
        }
        p.w = nw; p.h = nh;
      }
      closePop();
      renderCanvas();
    });
  });
}
function findFreeSpotIn(w, h, x, y, list) {
  const cx = Math.min(Math.max(x, 0), DASH_COLS - w);
  let maxY = 0;
  for (const p of list) maxY = Math.max(maxY, p.y + p.h);
  for (let yy = Math.max(y, 0); yy <= maxY + h; yy++) {
    const rect = { x: cx, y: yy, w, h };
    if (!list.some((q) => collides(rect, q))) return { x: cx, y: yy };
  }
  return { x: cx, y: Math.max(y, 0) };
}
function closePop() {
  pop.style.display = 'none';
  pop.innerHTML = '';
}
document.addEventListener('pointerdown', (e) => {
  if (pop.style.display !== 'none' && !pop.contains(e.target) && !e.target.closest('[data-act=variant]')) {
    closePop();
  }
});

/* ================================================================
 * 画布初始化 / 控件
 * ================================================================ */
function applyZoom() {
  const z = zoom;
  canvas.style.width = canvasBaseW * z + 'px';
  canvas.style.height = canvasBaseH * z + 'px';
  canvas.style.backgroundSize = `${(canvasBaseW * z) / 12}px 100%, 100% ${(canvasBaseH * z) / 15}px`;
  grid.style.transform = `scale(${z})`;
}
function applyPreset() {
  const preset = [
    { mod: 'clock', variant: 'big', x: 0, y: 0, w: 4, h: 3 },
    { mod: 'weather', variant: 'now', x: 4, y: 0, w: 2, h: 2 },
    { mod: 'countdown', variant: 'list', x: 6, y: 0, w: 4, h: 4 },
    { mod: 'sticky', variant: 'note', x: 10, y: 0, w: 2, h: 6 },
    { mod: 'sysmon', variant: 'compact', x: 0, y: 3, w: 2, h: 2 },
    { mod: 'todo', variant: 'overview', x: 2, y: 3, w: 2, h: 2 },
    { mod: 'clock', variant: 'month', x: 4, y: 4, w: 5, h: 5 },
    { mod: 'sysmon', variant: 'full', x: 0, y: 5, w: 4, h: 3 },
    { mod: 'todo', variant: 'list', x: 9, y: 6, w: 3, h: 6 },
    { mod: 'weather', variant: 'week', x: 4, y: 9, w: 5, h: 4 },
  ];
  placements = preset.map((it) => ({ uid: ++uid, ...it }));
  render();
}

// 顶栏控件
$('themeBtn').addEventListener('click', () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
});
$('zoom').addEventListener('input', (e) => {
  zoom = Number(e.target.value) / 100;
  $('zoomVal').textContent = e.target.value + '%';
  applyZoom();
});
$('clearBtn').addEventListener('click', () => { placements = []; render(); });
$('presetBtn').addEventListener('click', () => { applyPreset(); });
$('auditToggle').addEventListener('change', (e) => {
  document.querySelector('.canvas-wrap').classList.toggle('audit-on', e.target.checked);
  renderCanvas();
});

// 初始化
applyZoom();
renderLibrary();
applyPreset();
</script>
</body>
</html>
